<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="t d">
<title id="t">Analytics dashboard visual</title><desc id="d">A dark analytics dashboard with animated metric bars, trend line, and data indicators.</desc>
<defs>
 <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#101e32"/><stop offset="1" stop-color="#091321"/></linearGradient>
 <linearGradient id="cyan" x2="0" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
 <linearGradient id="violet" x2="0" y2="1"><stop stop-color="#a5b4fc"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1100" height="430" rx="22" fill="#07111f"/>
<rect x="14" y="14" width="1072" height="402" rx="18" fill="url(#panel)" stroke="#1d3b54"/>
<path d="M14 65H1086" stroke="#1d3b54"/>
<circle cx="42" cy="39" r="5" fill="#fb7185"/><circle cx="61" cy="39" r="5" fill="#fbbf24"/><circle cx="80" cy="39" r="5" fill="#34d399"/>
<text x="112" y="44" fill="#94a3b8" font-family="monospace" font-size="13">INSIGHT / LIVE ANALYTICS OVERVIEW</text>
<text x="1040" y="44" text-anchor="end" fill="#67e8f9" font-family="monospace" font-size="11">DATA STREAM ACTIVE</text>
<!-- KPI cards -->
<g>
 <rect x="38" y="86" width="235" height="82" rx="12" fill="#0b1b2c" stroke="#21435b"/>
 <rect x="292" y="86" width="235" height="82" rx="12" fill="#0b1b2c" stroke="#21435b"/>
 <rect x="546" y="86" width="235" height="82" rx="12" fill="#0b1b2c" stroke="#21435b"/>
 <rect x="800" y="86" width="262" height="82" rx="12" fill="#0b1b2c" stroke="#21435b"/>
 <g font-family="monospace"><g fill="#7894a9" font-size="11"><text x="58" y="112">DATA QUALITY</text><text x="312" y="112">QUERY ENGINE</text><text x="566" y="112">MODEL STATUS</text><text x="820" y="112">INSIGHT PIPELINE</text></g>
 <g fill="#e0f2fe" font-size="23"><text x="58" y="146">CLEAN</text><text x="312" y="146">SQL</text><text x="566" y="146">READY</text><text x="820" y="146">RUNNING</text></g></g>
 <circle cx="244" cy="137" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
 <circle cx="498" cy="137" r="5" fill="#67e8f9"><animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/></circle>
 <circle cx="752" cy="137" r="5" fill="#a5b4fc"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
 <circle cx="1032" cy="137" r="5" fill="#34d399"><animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/></circle>
</g>
<!-- chart area -->
<rect x="38" y="190" width="650" height="195" rx="12" fill="#091827" stroke="#1d3b54"/>
<text x="60" y="218" fill="#cbd5e1" font-family="monospace" font-size="12">TREND ANALYSIS</text>
<g stroke="#1d3b54" stroke-dasharray="3 7"><path d="M65 250H660M65 290H660M65 330H660M65 365H660"/></g>
<path d="M70 345 C125 332 145 300 200 315 S280 270 330 286 S410 238 460 260 S550 220 650 235" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900"><animate attributeName="stroke-dashoffset" from="900" to="0" dur="3.5s" fill="freeze" repeatCount="indefinite"/></path>
<path d="M70 345 C125 332 145 300 200 315 S280 270 330 286 S410 238 460 260 S550 220 650 235 L650 365H70Z" fill="#0891b2" opacity=".10"/>
<circle cx="650" cy="235" r="5" fill="#67e8f9"><animate attributeName="r" values="4;8;4" dur="1.8s" repeatCount="indefinite"/></circle>
<!-- bars -->
<rect x="710" y="190" width="352" height="195" rx="12" fill="#091827" stroke="#1d3b54"/>
<text x="734" y="218" fill="#cbd5e1" font-family="monospace" font-size="12">PROCESSING LOAD</text>
<g fill="#18354b"><rect x="742" y="246" width="300" height="13" rx="6"/><rect x="742" y="281" width="300" height="13" rx="6"/><rect x="742" y="316" width="300" height="13" rx="6"/><rect x="742" y="351" width="300" height="13" rx="6"/></g>
<g>
 <rect x="742" y="246" width="205" height="13" rx="6" fill="url(#cyan)"><animate attributeName="width" values="180;230;205" dur="4s" repeatCount="indefinite"/></rect>
 <rect x="742" y="281" width="260" height="13" rx="6" fill="url(#violet)"><animate attributeName="width" values="240;280;260" dur="3.2s" repeatCount="indefinite"/></rect>
 <rect x="742" y="316" width="155" height="13" rx="6" fill="url(#cyan)"><animate attributeName="width" values="135;185;155" dur="3.7s" repeatCount="indefinite"/></rect>
 <rect x="742" y="351" width="230" height="13" rx="6" fill="url(#violet)"><animate attributeName="width" values="210;250;230" dur="4.2s" repeatCount="indefinite"/></rect>
</g>
</svg>