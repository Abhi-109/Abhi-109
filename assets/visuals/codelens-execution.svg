<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" role="img" aria-labelledby="t d">
<title id="t">CodeLens execution visualization</title><desc id="d">Animated sequence showing code, trace, variable state and visual output.</desc>
<rect width="1000" height="270" rx="18" fill="#07111f"/>
<g stroke="#21435b" fill="#0c1d2d"><rect x="28" y="48" width="210" height="172" rx="12"/><rect x="270" y="48" width="210" height="172" rx="12"/><rect x="512" y="48" width="210" height="172" rx="12"/><rect x="754" y="48" width="218" height="172" rx="12"/></g>
<g font-family="monospace"><g fill="#67e8f9" font-size="12"><text x="48" y="76">01 / SOURCE</text><text x="290" y="76">02 / TRACE</text><text x="532" y="76">03 / STATE</text><text x="774" y="76">04 / VISUALIZE</text></g>
<g fill="#cbd5e1" font-size="13"><text x="48" y="112">for i in range(3):</text><text x="48" y="136">    total += i</text><text x="290" y="112">line 02</text><text x="290" y="136">step 03</text><text x="532" y="112">total = 3</text><text x="532" y="136">i = 2</text><text x="774" y="112">[0] [1] [2]</text><text x="774" y="136">  ●   ●   ●</text></g></g>
<g fill="none" stroke="#22d3ee" stroke-width="2"><path d="M238 132H270M480 132H512M722 132H754"/></g>
<g fill="#a5f3fc"><circle r="5"><animateMotion dur="4s" repeatCount="indefinite" path="M238 132H754"/></circle></g>
<g stroke="#1d4b63" stroke-dasharray="3 5"><path d="M48 174H218M290 174H460M532 174H702M774 174H952"/></g>
<text x="500" y="249" fill="#64748b" text-anchor="middle" font-family="monospace" font-size="11">TRACE DATA → STATE DIFF → MOTION → UNDERSTANDING</text>
</svg>