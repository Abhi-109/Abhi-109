<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Abhishek S | Data Analytics and AI Engineering</title>
<desc id="desc">Animated data universe with a glowing processor, orbiting Python, SQL, AI and ML nodes, travelling particles and a live waveform.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b16"/><stop offset=".52" stop-color="#0b1930"/><stop offset="1" stop-color="#100d25"/></linearGradient>
<linearGradient id="cyan"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<radialGradient id="core"><stop stop-color="#67e8f9" stop-opacity=".45"/><stop offset=".5" stop-color="#2563eb" stop-opacity=".18"/><stop offset="1" stop-color="#0b1930" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#29415f" stroke-width=".7" opacity=".42"/></pattern>
<clipPath id="clip"><rect width="1200" height="430" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="430" fill="url(#bg)"/><rect width="1200" height="430" fill="url(#grid)"/>
<circle cx="925" cy="205" r="230" fill="#2563eb" opacity=".12" filter="url(#soft)"><animate attributeName="opacity" values=".08;.2;.08" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="1020" cy="110" r="120" fill="#9333ea" opacity=".1" filter="url(#soft)"/>
<g font-family="monospace"><text x="76" y="83" fill="#67e8f9" font-size="14" letter-spacing="5">ABHISHEK S / DIGITAL WORKSPACE</text><path d="M76 104H470" stroke="#24445f"/><path d="M76 104H155" stroke="#67e8f9" stroke-width="2"><animate attributeName="x2" values="155;470;155" dur="5s" repeatCount="indefinite"/></path></g>
<text x="72" y="190" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="700" letter-spacing="-2">ABHISHEK S</text>
<text x="78" y="235" fill="#a5f3fc" font-family="monospace" font-size="19" letter-spacing="2">DATA ANALYTICS / AI ENGINEERING</text>
<text x="78" y="279" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Turning raw data into useful decisions.</text>
<g transform="translate(78 322)"><rect width="340" height="48" rx="8" fill="#081321" stroke="#24445f"/><circle cx="19" cy="24" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="34" y="29" fill="#cbd5e1" font-family="monospace" font-size="13">BUILDING: <tspan fill="#67e8f9">CODELENS</tspan></text><path d="M298 17V31" stroke="#67e8f9" stroke-width="2"><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></path></g>
<g transform="translate(890 212)">
<circle r="188" fill="url(#core)"/>
<circle r="150" fill="none" stroke="#1e4968" stroke-dasharray="2 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="55s" repeatCount="indefinite"/></circle>
<ellipse rx="165" ry="66" fill="none" stroke="#2563eb" stroke-width="1.4"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/></ellipse>
<ellipse rx="165" ry="66" fill="none" stroke="#8b5cf6" transform="rotate(60)"><animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="29s" repeatCount="indefinite"/></ellipse>
<ellipse rx="165" ry="66" fill="none" stroke="#22d3ee" opacity=".5" transform="rotate(-60)"><animateTransform attributeName="transform" type="rotate" from="-60" to="300" dur="34s" repeatCount="indefinite"/></ellipse>
<g stroke="#28749a" opacity=".7"><path d="M0 0L-145 -72M0 0L145 -72M0 0L-145 72M0 0L145 72M0 0V-165M0 0V165"/></g>
<circle r="76" fill="#0e7490" opacity=".12" filter="url(#glow)"><animate attributeName="r" values="68;82;68" dur="3.6s" repeatCount="indefinite"/></circle>
<circle r="53" fill="#091b30" stroke="#38bdf8" stroke-width="1.7"/><circle r="43" fill="none" stroke="#818cf8" stroke-dasharray="5 7"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></circle>
<text y="-5" text-anchor="middle" fill="#e0f2fe" font-family="monospace" font-size="17" font-weight="bold">DATA</text><text y="17" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="12" letter-spacing="3">CORE</text>
<g font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">
<g transform="translate(-145 -72)"><circle r="29" fill="#0b1b30" stroke="#22d3ee" stroke-width="1.5"/><circle r="35" fill="none" stroke="#22d3ee" opacity=".2"><animate attributeName="r" values="31;39;31" dur="3s" repeatCount="indefinite"/></circle><text y="5" fill="#a5f3fc">PY</text></g>
<g transform="translate(145 -72)"><circle r="29" fill="#0b1b30" stroke="#818cf8" stroke-width="1.5"/><text y="5" fill="#c4b5fd">SQL</text></g>
<g transform="translate(-145 72)"><circle r="29" fill="#0b1b30" stroke="#818cf8" stroke-width="1.5"/><text y="5" fill="#c4b5fd">AI</text></g>
<g transform="translate(145 72)"><circle r="29" fill="#0b1b30" stroke="#22d3ee" stroke-width="1.5"/><text y="5" fill="#a5f3fc">ML</text></g>
<g transform="translate(0 -165)"><circle r="25" fill="#0b1b30" stroke="#22d3ee"/><text y="5" fill="#a5f3fc">BI</text></g>
<g transform="translate(0 165)"><circle r="25" fill="#0b1b30" stroke="#818cf8"/><text y="5" fill="#c4b5fd">EDA</text></g></g>
<g fill="#a5f3fc" filter="url(#glow)"><circle r="4"><animateMotion dur="3.4s" repeatCount="indefinite" path="M-145 -72L0 0L145 72"/></circle><circle r="3.5"><animateMotion dur="4.1s" begin="-.9s" repeatCount="indefinite" path="M145 -72L0 0L-145 72"/></circle><circle r="3"><animateMotion dur="3.8s" begin="-2s" repeatCount="indefinite" path="M0 -165L0 0L0 165"/></circle><circle r="3"><animateMotion dur="4.5s" begin="-1.5s" repeatCount="indefinite" path="M-145 72L0 0L145 -72"/></circle></g>
</g>
<g transform="translate(520 386)" fill="none"><path d="M0 0H620" stroke="#193b56"/><path d="M0 0L28 0 38 -12 49 15 62 -24 75 7 89 0 130 0 143 -9 155 12 169 -18 184 0 220 0 234 -8 246 10 260 -15 274 0 620 0" stroke="url(#cyan)" stroke-width="2"><animate attributeName="stroke-dasharray" values="2 9;16 8;2 9" dur="4s" repeatCount="indefinite"/><animate attributeName="stroke-dashoffset" from="0" to="-90" dur="5s" repeatCount="indefinite"/></path></g>
<text x="1120" y="410" text-anchor="end" fill="#526982" font-family="monospace" font-size="10" letter-spacing="2">SYSTEM ONLINE / MCA</text>
